'Bogo Rule 1': '游戏原型：<a href="https://bogo.luogu.me">https://bogo.luogu.me</a>'
'Bogo Rule 2': 'Hydro 插件源代码下载地址：<a href="/file/1/bogo.zip">/file/1/bogo.zip</a>'
'Bogo Rule 3': '游戏的目标是将上方 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">[</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><mn>9</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[0, 1, \ldots, 9]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">1</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="minner">…</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">9</span><span class="mclose">]</span></span></span></span> 的排列排成升序。'
'Bogo Rule 4': '排列中 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn><mo separator="true">,</mo><mn>3</mn><mo separator="true">,</mo><mn>6</mn><mo separator="true">,</mo><mn>9</mn></mrow><annotation encoding="application/x-tex">0, 3, 6, 9</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">3</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">6</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">9</span></span></span></span> 分别由 <code>A</code>、<code>B</code>、<code>C</code>、<code>D</code> 代指，对应关系未知，但同一轮游戏内不变。'
'Bogo Rule 5': '对于每次操作，您可以选择交换或不交换排列中以橙色高亮的两项（由项的编号确定，不同玩家高亮的项不同），随后将进入 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>60</mn></mrow><annotation encoding="application/x-tex">60</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">60</span></span></span></span> 秒的冷却期，同时系统会为您更换高亮的两项。您也可以指定当前高亮的某一项不参与更换，但这会使冷却时间变为 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>300</mn></mrow><annotation encoding="application/x-tex">300</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">300</span></span></span></span> 秒。'
'Bogo Rule 6': '系统每次有 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>30</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">30\%</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8056em;vertical-align:-0.0556em;"></span><span class="mord">30%</span></span></span></span> 的概率高亮相邻的两项（首项和尾项也算相邻），<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>70</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">70\%</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8056em;vertical-align:-0.0556em;"></span><span class="mord">70%</span></span></span></span> 的概率高亮不相邻的两项，同一类情形中各可能性的出现概率相等。'
'Bogo Rule 7': '每次操作后，每让排列的逆序对数减少一个，您得到一个金币，奖池累积一个金币；每让排列的逆序对数增加一个，您失去一个金币，奖池累积一个金币。'
'Bogo Rule 8': '当排列排成升序时，最后的操作者将掏空奖池。'
'Bogo Rule 9': '<a href="/bogo/standings/0">前一轮结束时的金币排行</a>和<a href="/bogo/archive/0">前一轮的操作记录</a>于前一轮结束时公开，游戏过程中不公开。'
'Bogo Rule 10': '除非您手动取消，游戏界面每 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>15</mn></mrow><annotation encoding="application/x-tex">15</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">15</span></span></span></span> 秒自动刷新一次。'
'Bogo Rule 11': '请在玩游戏前先校准系统时钟。'
'Bogo Rule 12': '<strong>任何买卖本游戏内金币的都是骗子，请提高警惕，谨防上当受骗！</strong>'
"You haven't performed any operations in this round!": "您本轮中还没有执行过任何操作！"
