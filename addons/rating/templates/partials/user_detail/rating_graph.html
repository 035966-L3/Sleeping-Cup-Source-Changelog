{% if udoc.rpInfo.delta %}
<li class="section__tab-item">
  <h1 class="section__tab-title">{{ _('user_detail.rating_graph') }}</h1>
  <div class="section__tab-main">
    <div id="Nothing" style="display: none;">
      {{ nothing.render("Please, participate in at least 2 contests (currently 1) to unlock the rating graph.") }}
    </div>
    <svg id="Graph" style="dominant-baseline: middle; position: relative; width: 100%; aspect-ratio: 2"></svg>
    <script>
        function drawLine(from, to, color, index)
        {
            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", from[0] + "%");
            line.setAttribute("y1", from[1] + "%");
            line.setAttribute("x2", to[0] + "%");
            line.setAttribute("y2", to[1] + "%");
            line.setAttribute("stroke", color);
            line.setAttribute("z-index", index);
            document.getElementById('Graph').appendChild(line);
        }
        function drawCircle(x, y, r, color, index, hint)
        {
            let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", x + "%");
            circle.setAttribute("cy", y + "%");
            circle.setAttribute("r", r + "%");
            circle.setAttribute("fill", color);
            circle.setAttribute("z-index", index);
            circle.setAttribute("data-tooltip", hint);
            document.getElementById('Graph').appendChild(circle);
        }
        function drawText(x, y, color, size, content, index)
        {
            let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", x + "%");
            text.setAttribute("y", y + "%");
            text.setAttribute("text-anchor", "end");
            text.setAttribute("font-size", size);
            text.setAttribute("fill", color);
            text.setAttribute("z-index", index);
            text.textContent = content;
            document.getElementById('Graph').appendChild(text);
        }
        const levelCount = 8;
        const levels = [{% if handler.user.theme == 'dark' %}"#ffffff"{% else %}"#000000"{% endif %}, "#808080", "#804000", "#008000", "#00c0c0", "#0000ff", "#c0c000", "#ff8000", "#ff0000"];
        const bounds = [0, 1, 100, 200, 300, 400, 500, 600, 700];
        function getColor(rating)
        {
            let level = 0;
            while (level < levelCount && rating >= bounds[level + 1]) level++;
            return levels[level];
        }
        function draw()
        {
            document.getElementById('Graph').innerHTML = '';
            const a = `{{ udoc.rpInfo.delta }}`.trim().split('\n').map(line => line.split(' ').map(Number));
            if (a.length <= 3)
            {
                if (a)
                {
                    document.getElementById('Nothing').style = '';
                    document.getElementById('Graph').style = 'display: none;';
                }
                return undefined;
            }
            const hm = 6;
            const hl = 9;
            const hr = 97;
            const hs = 12;
            const he = 94;
            const vl = 5;
            const vr = 95;
            const textSize = 12;
            const textColor = {% if handler.user.theme == 'dark' %}"#fff"{% else %}"#000"{% endif %};
            const lineColor = {% if handler.user.theme == 'dark' %}"#fff"{% else %}"#000"{% endif %};
            const scaleColor = {% if handler.user.theme == 'dark' %}"#606060"{% else %}"#c0c0c0"{% endif %};
            const circleRadius = 0.75;
            const gap = 100;
            let n = a.length - 2;
            let maxRating = 0;
            let minRating = 99999;
            for (let i = 1; i <= n; i++)
            {
                maxRating = Math.max(maxRating, a[i][5] * 1);
                minRating = Math.min(minRating, a[i][5] * 1);
            }
            while (maxRating % 100 !== 0) maxRating++;
            while (minRating % 100 !== 0) minRating--;
            let sections = (maxRating - minRating) / gap;
            for (let i = 0, now = minRating; i <= sections; i++, now += gap)
            {
                let cv = vl * i / sections + vr * (1 - i / sections);
                drawText(hm, cv, textColor, textSize, now, 1);
                drawLine([hl, cv], [hr, cv], scaleColor, 1);
            }
            let maxId = a[1][0] * 1;
            let minId = a[n][0] * 1;
            for (let i = 1; i <= n - 1; i++)
                drawLine([he * (a[i][0] * 1 - minId) / (maxId - minId) + hs * (maxId - a[i][0] * 1) / (maxId - minId), vl * (a[i][5] * 1 - minRating) / (gap * sections) + vr * (1 - ((a[i][5] * 1 - minRating) / (gap * sections)))], [he * (a[i + 1][0] * 1 - minId) / (maxId - minId) + hs * (maxId - a[i + 1][0] * 1) / (maxId - minId), vl * (a[i + 1][5] * 1 - minRating) / (gap * sections) + vr * (1 - ((a[i + 1][5] * 1 - minRating) / (gap * sections)))], lineColor, 2);
            for (let i = 1; i <= n; i++)
                drawCircle(he * (a[i][0] * 1 - minId) / (maxId - minId) + hs * (maxId - a[i][0] * 1) / (maxId - minId), vl * (a[i][5] * 1 - minRating) / (gap * sections) + vr * (1 - ((a[i][5] * 1 - minRating) / (gap * sections))), circleRadius, getColor(a[i][5] * 1), 3, `Contest #${a[i][0]}: ${a[i][5] - a[i][4]} -> ${a[i][5]} (${a[i][4] > 0 ? "+": ""}${a[i][4]})`);
         }
     </script>
  </div>
</li>
{% else %}
<script>function draw(){}</script>
{% endif %}
